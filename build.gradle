plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.1.3' //Javalin
    implementation 'org.slf4j:slf4j-simple:2.0.12' //Log Javalin
    implementation 'org.mongodb:mongodb-driver-sync:4.11.1' //MongoDB
    implementation 'org.thymeleaf:thymeleaf:3.1.2.RELEASE' //Renderización de plantillas
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2' //Formato JSON WebSocket
}

application {
    mainClass = 'org.example.Main'
}

test {
    useJUnitPlatform()
}
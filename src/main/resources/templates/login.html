<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Iniciar Sesión', ~{::main})}">
<head><title>Iniciar Sesión</title></head>
<body>
<main>
    <div class="row justify-content-center align-items-center" style="min-height:70vh;">
        <div class="col-md-5 col-lg-4">

            <!-- Decoración -->
            <div class="text-center mb-4">
                <div style="width:68px;height:68px;background:linear-gradient(135deg,var(--terra-400),var(--clay-500));
                  border-radius:var(--radius-lg);display:inline-flex;align-items:center;justify-content:center;
                  box-shadow:0 8px 24px rgba(201,106,58,.35);margin-bottom:1rem;">
                    <i class="bi bi-clipboard-data" style="font-size:1.8rem;color:white;"></i>
                </div>
                <h2 style="font-family:var(--font-display);color:var(--carbon-800);margin-bottom:.25rem;">Bienvenido</h2>
                <p style="color:var(--ink-muted);font-size:.9rem;">Accede para registrar encuestas</p>
            </div>

            <div class="card" style="border:1px solid var(--clay-200)!important;animation:fadeUp .4s ease;">
                <div class="card-body p-4">

                    <div th:if="${error}" class="alert alert-danger mb-3">
                        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
                    </div>
                    <div th:if="${exito}" class="alert alert-success mb-3">
                        <i class="bi bi-check-circle me-2"></i><span th:text="${exito}"></span>
                    </div>

                    <!-- Aviso offline -->
                    <div class="alert alert-warning mb-3" id="offline-login-notice" style="display:none;">
                        <i class="bi bi-wifi-off me-2"></i>
                        Sin conexión — usando credenciales guardadas localmente
                    </div>

                    <form action="/login" method="post" id="form-login">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" required autofocus
                                       placeholder="Tu nombre de usuario">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" id="password-field" class="form-control" required
                                       placeholder="••••••••">
                                <button class="btn btn-sand" type="button" onclick="togglePass()">
                                    <i class="bi bi-eye" id="eye-icon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-clay w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </form>

                    <hr>
                    <p class="text-center mb-0" style="font-size:.875rem;color:var(--ink-muted);">
                        ¿No tienes cuenta? <a href="/registro" style="color:var(--terra-500);font-weight:600;">Regístrate aquí</a>
                    </p>
                </div>
            </div>

            <!-- Info offline -->
            <div class="card mt-3" style="background:var(--sand-200)!important;border:1px solid var(--clay-200)!important;">
                <div class="card-body py-3 px-4">
                    <div class="d-flex align-items-center gap-2" style="font-size:.8rem;color:var(--ink-soft);">
                        <i class="bi bi-info-circle" style="color:var(--terra-400);"></i>
                        La app funciona sin internet. Los registros se sincronizan al recuperar conexión.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function togglePass() {
            var f = document.getElementById('password-field');
            var i = document.getElementById('eye-icon');
            if (f.type === 'password') {
                f.type = 'text';
                i.className = 'bi bi-eye-slash';
            } else {
                f.type = 'password';
                i.className = 'bi bi-eye';
            }
        }

        window.addEventListener('offline', function() {
            document.getElementById('offline-login-notice').style.display = 'flex';
        });
    </script>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encuestas PUCMM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h4 class="text-center text-primary mb-4">Registro de Encuesta</h4>

    <div class="card shadow-sm p-4 mb-4">
        <form id="encuestaForm">
            <!-- Punto 6: Campos solicitados -->
            <div class="mb-3">
                <label>Nombre del encuestado:</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Sector:</label>
                <input type="text" id="sector" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Nivel Escolar:</label>
                <select id="nivelEscolar" class="form-select" required>
                    <option value="">Seleccione...</option>
                    <option value="Básico">Básico</option>
                    <option value="Medio">Medio</option>
                    <option value="Grado Universitario">Grado Universitario</option>
                    <option value="Postgrado">Postgrado</option>
                    <option value="Doctorado">Doctorado</option>
                </select>
            </div>
            <!-- Simulación del usuario (Punto 10 lo haremos luego con Auth) -->
            <input type="hidden" id="usuarioRegistro" value="admin_prueba">

            <button type="submit" class="btn btn-primary w-100">Guardar Registro</button>
        </form>
    </div>

    <button id="btnSincronizar" class="btn btn-success w-100">Sincronizar Datos al Servidor</button>
    <div id="status" class="mt-3 text-center fw-bold"></div>
</div>

<script>
    // Iniciar Web Worker (Punto 8)
    const syncWorker = new Worker('worker.js');

    // Escuchar respuestas del worker
    syncWorker.onmessage = function(e) {
        if (e.data.status === 'SUCCESS') {
            localStorage.removeItem('encuestasOffline'); // Limpiamos los datos locales
            document.getElementById('status').innerText = "¡Sincronización Exitosa!";
            document.getElementById('status').className = "mt-3 text-center fw-bold text-success";
        }
    };

    document.getElementById('encuestaForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Punto 7: Capturar Geolocalización
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(guardarDatos, mostrarErrorGPS);
        } else {
            alert("La geolocalización no es soportada por este navegador.");
        }
    });

    function guardarDatos(posicion) {
        const nuevaEncuesta = {
            nombre: document.getElementById('nombre').value,
            sector: document.getElementById('sector').value,
            nivelEscolar: document.getElementById('nivelEscolar').value,
            usuarioRegistro: document.getElementById('usuarioRegistro').value,
            latitud: posicion.coords.latitude,
            longitud: posicion.coords.longitude
        };

        // Punto 8: Almacenamiento Local (Web Storage)
        let encuestasGuardadas = JSON.parse(localStorage.getItem('encuestasOffline')) || [];
        encuestasGuardadas.push(nuevaEncuesta);
        localStorage.setItem('encuestasOffline', JSON.stringify(encuestasGuardadas));

        document.getElementById('encuestaForm').reset();
        alert("Encuesta guardada localmente. Total por sincronizar: " + encuestasGuardadas.length);
    }

    function mostrarErrorGPS(error) {
        alert("Error obteniendo GPS. Debe permitir la ubicación para registrar.");
    }

    // Botón manual para enviar datos
    document.getElementById('btnSincronizar').addEventListener('click', function() {
        let datos = localStorage.getItem('encuestasOffline');
        if (datos && JSON.parse(datos).length > 0) {
            document.getElementById('status').innerText = "Sincronizando...";
            // Le pasamos los datos al Web Worker para que los envíe en segundo plano
            syncWorker.postMessage({ type: 'SYNC', payload: datos });
        } else {
            alert("No hay datos pendientes por sincronizar.");
        }
    });
</script>
</body>
</html>

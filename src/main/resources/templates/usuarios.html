<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Gestión de Usuarios', ~{::main})}">
<head><title>Usuarios</title></head>
<body>
<main>

    <div class="section-header mb-4">
        <div>
            <h2>Gestión de Usuarios</h2>
            <p class="section-subtitle">Administra los encuestadores y supervisores del sistema</p>
        </div>
        <div class="d-flex gap-2">
            <a href="/admin/dashboard" class="btn btn-sand btn-sm">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
            <a href="/admin/encuestas" class="btn btn-clay btn-sm">
                <i class="bi bi-clipboard-data me-1"></i>Encuestas
            </a>
        </div>
    </div>

    <!-- Stats resumen -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
                <div class="stat-icon olive"><i class="bi bi-people-fill"></i></div>
                <div>
                    <div class="stat-value" th:text="${totalUsuarios}">0</div>
                    <div class="stat-label">Total Usuarios</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
                <div class="stat-icon terra"><i class="bi bi-person-badge-fill"></i></div>
                <div>
                    <div class="stat-value" th:text="${totalEncuestadores}">0</div>
                    <div class="stat-label">Encuestadores</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de usuarios -->
    <div class="card">
        <div class="card-header">
            <span style="font-weight:700;color:var(--carbon-800);">
                <i class="bi bi-people me-2" style="color:var(--olive-400);"></i>Lista de Usuarios
            </span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-clay mb-0">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Rol</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div style="width:30px;height:30px;background:linear-gradient(135deg,var(--terra-400),var(--clay-500));
                                         border-radius:50%;display:flex;align-items:center;justify-content:center;
                                         color:white;font-size:.75rem;font-weight:700;flex-shrink:0;"
                                     th:text="${#strings.substring(u.nombre, 0, 1)}">U</div>
                                <span th:text="${u.nombre}">—</span>
                            </div>
                        </td>
                        <td><code th:text="${u.username}">—</code></td>
                        <td><small th:text="${u.email}">—</small></td>
                        <td>
                            <span class="badge badge-clay" th:text="${u.rol}">—</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="4" class="text-center py-4 text-muted">No hay usuarios registrados</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>
</body>
</html>

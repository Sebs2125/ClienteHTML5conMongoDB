<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encuestas PUCMM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librería Webcam Easy (Punto 14) -->
    <script type="text/javascript" src="https://unpkg.com/webcam-easy/dist/webcam-easy.min.js"></script>
    <style>
        #webcam { width: 100%; max-width: 400px; border-radius: 8px; border: 2px solid #ccc; display: none; }
        #canvas { display: none; } /* Oculto, solo se usa para extraer la imagen */
        #fotoCapturada { width: 100%; max-width: 400px; border-radius: 8px; display: none; margin-top: 10px; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <!-- Navegación y Usuario -->
    <div class="d-flex justify-content-between mb-3">
        <h4 class="text-primary">Registro de Encuesta</h4>
        <div>
            <span id="usuarioDisplay" class="badge bg-secondary me-2">Offline</span>
            <a href="/mapa.html" class="btn btn-sm btn-outline-info">Ver Mapa</a>
        </div>
    </div>

    <!-- Formulario Principal -->
    <div class="card shadow-sm p-4 mb-4">
        <form id="encuestaForm">
            <input type="hidden" id="editIndex" value="-1"> <!-- Para saber si estamos editando (Punto 11) -->

            <div class="mb-3">
                <label>Nombre del encuestado:</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Sector:</label>
                <input type="text" id="sector" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Nivel Escolar:</label>
                <select id="nivelEscolar" class="form-select" required>
                    <option value="">Seleccione...</option>
                    <option value="Básico">Básico</option>
                    <option value="Medio">Medio</option>
                    <option value="Grado Universitario">Grado Universitario</option>
                    <option value="Postgrado">Postgrado</option>
                    <option value="Doctorado">Doctorado</option>
                </select>
            </div>

            <!-- Cámara (Punto 14) -->
            <div class="mb-3 text-center bg-light p-3 rounded border">
                <label class="fw-bold mb-2">Foto del Encuestado</label><br>
                <video id="webcam" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <img id="fotoCapturada" src="">

                <div class="mt-2">
                    <button type="button" id="btnIniciarCamara" class="btn btn-sm btn-secondary">Abrir Cámara</button>
                    <button type="button" id="btnTomarFoto" class="btn btn-sm btn-warning" style="display:none;">Capturar</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="btnGuardar">Guardar Registro Local</button>
            <button type="button" class="btn btn-secondary w-100 mt-2" id="btnCancelarEdicion" style="display:none;">Cancelar Edición</button>
        </form>
    </div>

    <!-- Tabla de Registros Offline (Punto 11) -->
    <h5 class="mt-4">Registros Pendientes (Offline)</h5>
    <div class="table-responsive">
        <table class="table table-bordered bg-white" id="tablaOffline">
            <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Sector</th>
                <th>Foto</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="listaOffline">
            <!-- Llenado por JS -->
            </tbody>
        </table>
    </div>

    <button id="btnSincronizar" class="btn btn-success w-100 mt-2 mb-5">Sincronizar Datos al Servidor</button>
    <div id="status" class="mt-3 text-center fw-bold"></div>
</div>

<script>
    // --- 1. CONFIGURACIÓN DE CÁMARA (Punto 14) ---
    const webcamElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('canvas');
    const webcam = new Webcam(webcamElement, 'user', canvasElement); // 'user' = cámara frontal, 'environment' = trasera
    let fotoBase64Actual = "";

    document.getElementById('btnIniciarCamara').addEventListener('click', () => {
        webcam.start()
            .then(result => {
                webcamElement.style.display = 'block';
                document.getElementById('btnTomarFoto').style.display = 'inline-block';
                document.getElementById('btnIniciarCamara').style.display = 'none';
                document.getElementById('fotoCapturada').style.display = 'none';
            })
            .catch(err => {
                alert("Error abriendo la cámara: " + err);
            });
    });

    document.getElementById('btnTomarFoto').addEventListener('click', () => {
        // snap() captura la imagen y devuelve un string en Base64
        fotoBase64Actual = webcam.snap();
        document.getElementById('fotoCapturada').src = fotoBase64Actual;
        document.getElementById('fotoCapturada').style.display = 'block';
        webcamElement.style.display = 'none';
        document.getElementById('btnTomarFoto').style.display = 'none';
        document.getElementById('btnIniciarCamara').style.display = 'inline-block';
        document.getElementById('btnIniciarCamara').innerText = "Retomar Foto";
        webcam.stop();
    });

    // --- 2. MANEJO DE USUARIO LOGUEADO (Punto 10) ---
    let usuarioActual = "anonimo";
    const userLocal = localStorage.getItem('usuarioLogueado');
    if (userLocal) {
        usuarioActual = JSON.parse(userLocal).usuario;
        document.getElementById('usuarioDisplay').innerText = "Usuario: " + usuarioActual;
        document.getElementById('usuarioDisplay').classList.replace('bg-secondary', 'bg-success');
    } else {
        // Si quieres forzar el login, descomenta la siguiente línea:
        // window.location.href = '/login.html';
    }

    // --- 3. GESTIÓN OFFLINE Y EDICIÓN (Punto 11) ---
    function cargarTablaOffline() {
        const tbody = document.getElementById('listaOffline');
        tbody.innerHTML = '';
        let encuestas = JSON.parse(localStorage.getItem('encuestasOffline')) || [];

        encuestas.forEach((enc, index) => {
            let fotoHtml = enc.fotoBase64 ? `<img src="${enc.fotoBase64}" width="40" height="40" style="border-radius:50%">` : 'Sin foto';
            tbody.innerHTML += `
                    <tr>
                        <td>${enc.nombre}</td>
                        <td>${enc.sector}</td>
                        <td>${fotoHtml}</td>
                        <td>
                            <button onclick="editarRegistro(${index})" class="btn btn-sm btn-info">Editar</button>
                            <button onclick="borrarRegistro(${index})" class="btn btn-sm btn-danger">Borrar</button>
                        </td>
                    </tr>
                `;
        });
    }

    // Cargar tabla al iniciar
    cargarTablaOffline();

    // Borrar (Punto 11)
    window.borrarRegistro = function(index) {
        if(confirm("¿Seguro que deseas eliminar este registro local?")) {
            let encuestas = JSON.parse(localStorage.getItem('encuestasOffline')) || [];
            encuestas.splice(index, 1);
            localStorage.setItem('encuestasOffline', JSON.stringify(encuestas));
            cargarTablaOffline();
        }
    };

    // Editar (Punto 11)
    window.editarRegistro = function(index) {
        let encuestas = JSON.parse(localStorage.getItem('encuestasOffline')) || [];
        let enc = encuestas[index];

        document.getElementById('nombre').value = enc.nombre;
        document.getElementById('sector').value = enc.sector;
        document.getElementById('nivelEscolar').value = enc.nivelEscolar;
        document.getElementById('editIndex').value = index;

        if(enc.fotoBase64) {
            fotoBase64Actual = enc.fotoBase64;
            document.getElementById('fotoCapturada').src = fotoBase64Actual;
            document.getElementById('fotoCapturada').style.display = 'block';
        }

        document.getElementById('btnGuardar').innerText = "Actualizar Registro";
        document.getElementById('btnGuardar').classList.replace('btn-primary', 'btn-warning');
        document.getElementById('btnCancelarEdicion').style.display = 'block';
        window.scrollTo(0, 0); // Subir la pantalla
    };

    document.getElementById('btnCancelarEdicion').addEventListener('click', limpiarFormulario);

    function limpiarFormulario() {
        document.getElementById('encuestaForm').reset();
        document.getElementById('editIndex').value = "-1";
        document.getElementById('btnGuardar').innerText = "Guardar Registro Local";
        document.getElementById('btnGuardar').classList.replace('btn-warning', 'btn-primary');
        document.getElementById('btnCancelarEdicion').style.display = 'none';
        document.getElementById('fotoCapturada').style.display = 'none';
        fotoBase64Actual = "";
        if(webcamElement.style.display === 'block') webcam.stop();
    }

    // --- 4. GUARDAR / ACTUALIZAR (Puntos 6, 7, 11, 14) ---
    document.getElementById('encuestaForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(procesarGuardado, mostrarErrorGPS);
        } else {
            alert("La geolocalización no es soportada.");
        }
    });

    function procesarGuardado(posicion) {
        let encuestasGuardadas = JSON.parse(localStorage.getItem('encuestasOffline')) || [];
        let indexEdicion = parseInt(document.getElementById('editIndex').value);

        const datos = {
            nombre: document.getElementById('nombre').value,
            sector: document.getElementById('sector').value,
            nivelEscolar: document.getElementById('nivelEscolar').value,
            usuarioRegistro: usuarioActual,
            latitud: posicion.coords.latitude,
            longitud: posicion.coords.longitude,
            fotoBase64: fotoBase64Actual // La foto capturada
        };

        if (indexEdicion >= 0) {
            // Modo Edición
            encuestasGuardadas[indexEdicion] = datos;
            alert("Registro actualizado correctamente.");
        } else {
            // Modo Nuevo
            encuestasGuardadas.push(datos);
            alert("Encuesta guardada localmente.");
        }

        localStorage.setItem('encuestasOffline', JSON.stringify(encuestasGuardadas));
        limpiarFormulario();
        cargarTablaOffline();
    }

    function mostrarErrorGPS(error) { alert("Debe permitir la ubicación para registrar."); }

    // --- 5. SINCRONIZACIÓN (Web Worker) ---
    const syncWorker = new Worker('worker.js');
    syncWorker.onmessage = function(e) {
        if (e.data.status === 'SUCCESS') {
            localStorage.removeItem('encuestasOffline');
            cargarTablaOffline();
            document.getElementById('status').innerText = "¡Sincronización Exitosa!";
            document.getElementById('status').className = "mt-3 text-center fw-bold text-success";
            setTimeout(() => { document.getElementById('status').innerText = ""; }, 3000);
        }
    };

    document.getElementById('btnSincronizar').addEventListener('click', function() {
        let datos = localStorage.getItem('encuestasOffline');
        if (datos && JSON.parse(datos).length > 0) {
            document.getElementById('status').innerText = "Sincronizando...";
            syncWorker.postMessage({ type: 'SYNC', payload: datos });
        } else {
            alert("No hay datos pendientes por sincronizar.");
        }
    });
</script>
</body>
</html>

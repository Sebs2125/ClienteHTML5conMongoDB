<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' — OP Encuestas PUCMM'">OP Encuestas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<div class="offline-banner" id="offline-banner">
    <i class="bi bi-wifi-off me-2"></i>

    <span class="sync-indicator ms-3" id="pending-badge" style="display:none;">
        <span class="pulse-dot"></span>
        <span id="pending-count">0</span> pendientes
    </span>
</div>

<nav class="navbar navbar-clay navbar-expand-lg">
    <div class="container-lg">
        <a class="navbar-brand" href="/">
            <div class="brand-icon"><i class="bi bi-clipboard-data"></i></div>
            <div>

            </div>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <i class="bi bi-list"></i>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto gap-2 mt-2 mt-lg-0">
                <li class="nav-item" th:if="${session.usuario != null}">
                    <a class="nav-link-clay" href="/encuestas/nueva">
                        <i class="bi bi-plus-circle me-1"></i>Nueva Encuesta
                    </a>
                </li>
                <li class="nav-item" th:if="${session.rol == 'ADMINISTRADOR' or session.rol == 'SUPERVISOR'}">
                    <a class="nav-link-clay" href="/mapa">
                        <i class="bi bi-map me-1"></i>Mapa
                    </a>
                </li>
                <li class="nav-item" th:if="${session.usuario != null}">
                    <a class="nav-link-clay" href="/mis-encuestas">
                        <i class="bi bi-collection me-1"></i>Mis Registros
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-lg-center gap-2 mt-2 mt-lg-0">
                <li class="nav-item" th:if="${session.usuario == null}">
                    <a href="/login" class="btn btn-primary btn-sm px-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                    </a>
                </li>

                <li class="nav-item dropdown" th:if="${session.usuario != null}">
                    <a href="#" class="nav-link-clay d-flex align-items-center gap-2" role="button" data-bs-toggle="dropdown">
                        <div class="user-avatar">
                            <span th:text="${#strings.substring(session.usuario.nombre, 0, 1)}">U</span>
                        </div>
                        <span th:text="${session.usuario.nombre}" class="d-none d-md-inline">Usuario</span>
                        <span class="badge-rol-clay" th:text="${session.rol}">ROL</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-clay">
                        <li>
                            <div class="dropdown-header-clay">
                                <strong th:text="${session.usuario.nombre}">Nombre</strong>
                                <small th:text="${session.usuario.email}">email@example.com</small>
                            </div>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li th:if="${session.rol == 'ENCUESTADOR'}">
                            <a class="dropdown-item" href="/mis-encuestas">
                                <i class="bi bi-collection me-2"></i>Mis Encuestas
                            </a>
                        </li>
                        <li th:if="${session.rol == 'ENCUESTADOR'}">
                            <a class="dropdown-item" href="/perfil">
                                <i class="bi bi-person-gear me-2"></i>Mi Perfil
                            </a>
                        </li>
                        <li th:if="${session.rol == 'ADMINISTRADOR'}">
                            <a class="dropdown-item" href="/admin/dashboard">
                                <i class="bi bi-shield-lock me-2"></i>Administrar
                            </a>
                        </li>
                        <li th:if="${session.rol == 'SUPERVISOR'}">
                            <a class="dropdown-item" href="/supervisor/dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a class="dropdown-item text-danger" href="/logout">
                                <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="py-4">
    <div class="container-lg" th:insert="${contenido}"></div>
</main>

<footer class="footer-clay">
    <div class="container-lg">
        <div class="row align-items-center py-3">
            <div class="col-md-6">

            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/offline.js"></script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Mi Perfil', ~{::main})}">
<head><title>Mi Perfil</title></head>
<body>
<main>

    <div class="section-header mb-4">
        <div>
            <h2>Mi Perfil</h2>
            <p class="section-subtitle">Información de tu cuenta</p>
        </div>
        <a href="/encuestas/nueva" class="btn btn-clay btn-sm">
            <i class="bi bi-plus-circle me-1"></i>Nueva Encuesta
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header clay-header text-center py-4">
                    <!-- Avatar grande -->
                    <div style="width:72px;height:72px;background:rgba(255,255,255,.2);
                         border-radius:50%;display:flex;align-items:center;justify-content:center;
                         color:white;font-size:2rem;font-weight:700;margin:0 auto .75rem;
                         border:3px solid rgba(255,255,255,.4);"
                         th:text="${session.usuario != null ? #strings.substring(session.usuario.nombre, 0, 1) : 'U'}">U</div>
                    <h4 style="color:white;margin:0;font-family:var(--font-display);"
                        th:text="${session.usuario != null ? session.usuario.nombre : '—'}">Nombre</h4>
                    <span class="badge mt-1" style="background:rgba(255,255,255,.2);color:white;"
                          th:text="${session.rol != null ? session.rol : '—'}">ROL</span>
                </div>

                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item px-4 py-3 d-flex justify-content-between align-items-center">
                            <span style="font-size:.82rem;color:var(--ink-muted);">
                                <i class="bi bi-person me-2" style="color:var(--terra-400);"></i>Usuario
                            </span>
                            <code th:text="${session.usuario != null ? session.usuario.username : '—'}">—</code>
                        </li>
                        <li class="list-group-item px-4 py-3 d-flex justify-content-between align-items-center">
                            <span style="font-size:.82rem;color:var(--ink-muted);">
                                <i class="bi bi-envelope me-2" style="color:var(--terra-400);"></i>Email
                            </span>
                            <span style="font-size:.875rem;" th:text="${session.usuario != null ? session.usuario.email : '—'}">—</span>
                        </li>
                        <li class="list-group-item px-4 py-3 d-flex justify-content-between align-items-center">
                            <span style="font-size:.82rem;color:var(--ink-muted);">
                                <i class="bi bi-shield me-2" style="color:var(--terra-400);"></i>Rol
                            </span>
                            <span class="badge badge-clay" th:text="${session.rol != null ? session.rol : '—'}">—</span>
                        </li>
                    </ul>
                </div>

                <div class="card-body py-3 px-4 d-flex gap-2">
                    <a href="/mis-encuestas" class="btn btn-clay-outline flex-grow-1">
                        <i class="bi bi-collection me-1"></i>Mis Encuestas
                    </a>
                    <a href="/logout" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </a>
                </div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
